# Non-compliant: two Services in the same namespace share an identical selector
# (K8sAzureV1UniqueServiceSelector).
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: default
spec:
  selector:
    app: shared
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-duplicate
  namespace: default
spec:
  selector:
    app: shared
  ports:
    - port: 80
      targetPort: 8080
